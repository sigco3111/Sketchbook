name: Korean build and Pages
on:
  push:
    branches: [master]
    paths-ignore: ['README.md', 'README.en.md']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node localize.mjs
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Save translated source
        run: |
          git config user.name 'sigco3111'
          git config user.email 'sigco3111@users.noreply.github.com'
          git add README.md README.en.md index.html src build/sketchbook.min.js
          git diff --cached --quiet || (git commit -m 'Apply Korean localization and build [skip ci]' && git push)
      - run: mkdir -p _site && cp index.html favicon.ico _site/ && cp -r build _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
